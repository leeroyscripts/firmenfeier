<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020304">
  <meta name="color-scheme" content="dark">
  <title>FIRMENFEIER · Flugmodus X 405x</title>
  <meta name="description" content="Firmenfeier – interaktiver Gaussian Splat. Flugmodus X 405x.">
  <meta property="og:title" content="FIRMENFEIER · Flugmodus X 405x">
  <meta property="og:description" content="Interaktiver Gaussian Splat. Ziehen, drehen, zoomen.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://leeroyscripts.github.io/firmenfeier/">
  <meta property="og:image" content="https://leeroyscripts.github.io/firmenfeier/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23020304'/%3E%3Cpath d='M6 6h6M6 6v6M26 6h-6M26 6v6M6 26h6M6 26v-6M26 26h-6M26 26v-6' stroke='%237df9ff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23eaf6f8'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/unbounded-latin-900-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/jetbrains-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "playcanvas": "./lib/playcanvas.min.mjs" } }
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body class="is-loading">

  <!-- Abstract background (behind the transparent WebGL canvas) -->
  <div class="bg" aria-hidden="true">
    <div class="bg-glow"></div>
    <div class="bg-dots"></div>
    <svg class="bg-rings" viewBox="-500 -500 1000 1000" preserveAspectRatio="xMidYMid meet">
      <g class="ring ring-a"><circle r="470" /></g>
      <g class="ring ring-b"><circle r="360" /></g>
      <g class="ring ring-c"><circle r="250" /></g>
      <g class="ring ring-d"><circle r="140" /></g>
      <path class="ring-axis" d="M-490 0H-300M300 0H490M0 -490V-300M0 300V490" />
    </svg>
    <div class="bg-sweep"></div>
  </div>

  <canvas id="stage" aria-label="Interaktiver Gaussian Splat. Ziehen zum Drehen, Scrollen oder Zwei-Finger-Geste zum Zoomen."></canvas>

  <div class="fx-vignette" aria-hidden="true"></div>
  <div class="fx-grain" aria-hidden="true"></div>

  <!-- HUD -->
  <div class="hud" aria-hidden="true">
    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>

    <div class="hud-block hud-tl">
      <div class="row"><span class="dot live"></span><span class="label" data-scramble>GS//VIEWER</span><span class="val">v1.0</span></div>
      <div class="row dim"><span class="label">SCAN</span><span class="val" id="hud-scan">001 · GROUP</span></div>
      <div class="row dim"><span class="label">MODE</span><span class="val" id="hud-mode">ORBIT</span></div>
      <div class="row dim" hidden><span class="label">SRC</span><span class="val" id="hud-src"></span></div>
    </div>

    <div class="hud-heading">
      <div class="tape"><div class="tape-strip" id="tape-strip"></div></div>
      <div class="tape-caret"></div>
      <div class="tape-readout" id="hud-hdg">000</div>
    </div>

    <div class="hud-block hud-tr">
      <div class="row"><span class="label">T</span><span class="val" id="hud-clock">00:00:00</span></div>
      <div class="row dim"><span class="label">FPS</span><span class="val" id="hud-fps">--</span></div>
      <div class="row dim hide-s"><span class="label">RES</span><span class="val" id="hud-res">----</span></div>
      <div class="row dim hide-s"><span class="label">SPLATS</span><span class="val" id="hud-splats">995 790</span></div>
    </div>

    <div class="hud-block hud-l">
      <div class="row"><span class="label">AZ</span><span class="val" id="hud-az">000.0°</span></div>
      <div class="row"><span class="label">EL</span><span class="val" id="hud-el">+00.0°</span></div>
      <div class="row"><span class="label">DST</span><span class="val" id="hud-dst">0.00 m</span></div>
      <div class="bar"><i id="hud-zoom"></i></div>
    </div>

    <div class="hud-ladder">
      <div class="ladder"><div class="ladder-strip" id="ladder-strip"></div></div>
      <div class="ladder-caret"></div>
    </div>

    <div class="reticle"><i></i></div>

    <div class="hud-hint" id="hud-hint">DRAG&nbsp;·&nbsp;ROTATE &nbsp; / &nbsp; SCROLL&nbsp;·&nbsp;ZOOM &nbsp; / &nbsp; RIGHT-DRAG&nbsp;·&nbsp;PAN &nbsp; / &nbsp; ←&nbsp;→&nbsp;·&nbsp;SCENE</div>
  </div>

  <div class="scene-tip" id="scene-tip" role="status"></div>

  <!-- Scene switch -->
  <button type="button" class="nav-btn prev" id="btn-prev" aria-label="Zurück">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5 7.5 12l7 7" /></svg>
    <span class="nav-label" id="nav-prev-label"></span>
  </button>
  <button type="button" class="nav-btn next" id="btn-next" aria-label="Weiter">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5l7 7-7 7" /></svg>
    <span class="nav-label" id="nav-next-label"></span>
  </button>

  <div class="controls">
    <button type="button" id="btn-auto" aria-pressed="true" title="Automatisch drehen">AUTO</button>
    <button type="button" id="btn-reset" title="Ansicht zurücksetzen">RESET</button>
    <button type="button" id="btn-full" title="Vollbild">FULL</button>
  </div>

  <!-- Loader -->
  <div class="loader" id="loader" role="status" aria-live="polite">
    <svg class="loader-ring" viewBox="0 0 120 120" aria-hidden="true">
      <circle class="track" cx="60" cy="60" r="54" />
      <circle class="prog" id="loader-prog" cx="60" cy="60" r="54" />
      <circle class="ticks" cx="60" cy="60" r="46" />
    </svg>
    <div class="loader-text">
      <div class="loader-pct" id="loader-pct">000<small>%</small></div>
      <div class="loader-state" id="loader-state">LINKING</div>
      <div class="loader-bytes" id="loader-bytes">0.0 / -- MB</div>
    </div>
  </div>

  <div class="error" id="error" hidden>
    <div class="error-title">SIGNAL LOST</div>
    <div class="error-msg" id="error-msg">WebGL2 wird benötigt.</div>
  </div>

  <!-- Title -->
  <header class="title">
    <p class="kicker" data-scramble>Flugmodus X 405x</p>
    <h1 class="headline" id="headline">FIRMENFEIER</h1>
  </header>

</body>
</html>
